<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Exp by Gijoong CHANG</title>

  <!-- jsPsych本体（CDN） -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>

  <!-- jsPsychプラグインたち（CDN） -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.1"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

  <!-- p5.js本体（CDN） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"
    integrity="sha512-rCZdHNB0AePry6kAnKAVFMRfWPmUXSo+/vlGtrOUvhsxD0Punm/xWbEh+8vppPIOzKB9xnk42yCRZ5MD/jvvjQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- jsPsych用p5プラグイン（ローカルファイル） -->
  <script src="jspsych-p5.js"></script>

  <!-- スタイル -->
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- 여기에 스타일 태그 추가 -->
  <style>
    body {
      background-color: #646464;
      color: #e0e0e0;
    }

    .jspsych-content {
      color: #e0e0e0;
      font-family: 'Arial', sans-serif;
    }

    .jspsych-btn {
      background-color: #444;
      color: #fff;
      border: 1px solid #aaa;
    }

    h3,
    p {
      color: #e0e0e0 !important;
    }

    /* Likert 라벨 텍스트 */
    .jspsych-survey-likert .jspsych-survey-likert-statement {
      font-size: 22px;
    }

    /* 각 라벨(span 안 텍스트) */
    .jspsych-survey-likert .jspsych-survey-likert-label {
      font-size: 20px;
      line-height: 1.3;
    }

    /* Likert 전체 폭 */
    .jspsych-survey-likert ul {
      width: 900px;
      /* 기본값보다 훨씬 김 */
      margin: 30px auto;
      /* 중앙 정렬 */
    }

    .center-marker-slider input[type="range"] {
      position: relative;
    }

    .center-marker-slider input[type="range"]::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 14px;
      width: 2px;
      background: #e0e0e0;
      pointer-events: none;
    }
  </style>

  <!-- 実験スクリプト -->
  <script src="SfM_slider_ko.js"></script>
</head>

<body></body>

</html>
