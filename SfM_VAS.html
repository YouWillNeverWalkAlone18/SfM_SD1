<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Exp by Gijoong CHANG</title>

    <!-- jsPsych本体（CDN） -->
    <script src="https://unpkg.com/jspsych@7.3.0"></script>

    <!-- jsPsychプラグインたち（CDN） -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

    <!-- p5.js本体（CDN） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"
        integrity="sha512-rCZdHNB0AePry6kAnKAVFMRfWPmUXSo+/vlGtrOUvhsxD0Punm/xWbEh+8vppPIOzKB9xnk42yCRZ5MD/jvvjQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- jsPsych用p5プラグイン（ローカルファイル） -->
    <script src="jspsych-p5.js"></script>

    <!-- スタイル -->
    <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- 여기에 스타일 태그 추가 -->
    <style>
        body {
            background-color: #646464;
            color: #e0e0e0;
        }

        .jspsych-content {
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
        }

        .jspsych-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #aaa;
        }

        h3,
        p {
            color: #e0e0e0 !important;
        }

        /* --- 추가된 부분 --- */
        /* slider 전체 trial 영역 */
        .jspsych-html-slider-response {
            overflow: visible !important;
        }

        /* slider 컨테이너 (트랙 기준) */
        .jspsych-html-slider-response .jspsych-slider-container {
            position: relative;
            width: 800px;
            /* slider_width와 맞추거나 약간 크게 */
            margin: 50px auto;
            /* 상하 여백 */
            overflow: visible !important;
        }

        /* 실제 input range */
        .jspsych-html-slider-response .jspsych-slider {
            width: 100%;
        }

        /* 왼쪽 극단 설명 (양옆 배치를 위해 수정) */
        .jspsych-html-slider-response .jspsych-slider-container::before {
            content: "（両方の方向が見えた）";
            position: absolute;
            /* ul의 가장 왼쪽(0)에서 왼쪽으로 자신의 크기만큼(-100%) 이동 */
            left: -20px;
            transform: translateX(-100%);
            top: 50%;
            margin-top: -10px;
            /* 세로 중앙 정렬 미세조정 */
            color: #e0e0e0;
            font-size: 16px;
            white-space: nowrap;
            font-weight: bold;
        }

        /* 오른쪽 극단 설명 (양옆 배치를 위해 수정) */
        .jspsych-html-slider-response .jspsych-slider-container::after {
            content: "（1方向だけが見えていた）";
            position: absolute;
            /* ul의 가장 오른쪽(100%)에서 오른쪽으로 이동 */
            right: -20px;
            transform: translateX(100%);
            top: 50%;
            margin-top: -10px;
            /* 세로 중앙 정렬 미세조정 */
            color: #e0e0e0;
            font-size: 16px;
            white-space: nowrap;
            font-weight: bold;
        }
    </style>

    <!-- 実験スクリプト -->
    <script src="SfM_VAS.js"></script>
</head>

<body></body>


</html>
